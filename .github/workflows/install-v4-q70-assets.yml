name: Install V4 Q70 assets

on:
  push:
    branches:
      - feat/loomie-psychology-lp-v4
    paths:
      - transfer/v4-q70/chunk.17

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct verified Q70 asset package
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 00 17); do test -f "transfer/v4-q70/chunk.${i}"; done
          : > /tmp/v4-q70.tar.gz.b64
          for i in $(seq -w 00 17); do cat "transfer/v4-q70/chunk.${i}" >> /tmp/v4-q70.tar.gz.b64; done
          base64 -d /tmp/v4-q70.tar.gz.b64 > /tmp/v4-q70.tar.gz
          echo "cb715d3b3ec8631d7b00af2788158cb11de0e348811f8912cb857ab96ef2cf9e  /tmp/v4-q70.tar.gz" | sha256sum -c -
          rm -rf /tmp/v4-q70
          mkdir -p /tmp/v4-q70 public/product-v4
          tar -xzf /tmp/v4-q70.tar.gz -C /tmp/v4-q70
          for name in kanban-left contact-history dashboard; do
            test -f "/tmp/v4-q70/${name}.webp"
            test "$(stat -c%s "/tmp/v4-q70/${name}.webp")" -gt 30000
            cp "/tmp/v4-q70/${name}.webp" "public/product-v4/${name}.webp"
          done
      - name: Commit clean Q70 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf transfer/v4-q70
          rmdir transfer 2>/dev/null || true
          rm .github/workflows/install-v4-q70-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sharpen V4 product assets"
          git push
