name: Install V4 assets

on:
  push:
    branches:
      - feat/loomie-psychology-lp-v4
    paths:
      - transfer/v4-assets/chunk.09

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct verified asset package
        shell: bash
        run: |
          set -euo pipefail
          test -f transfer/v4-assets/chunk.first
          for i in $(seq -w 0 9); do test -f "transfer/v4-assets/chunk.${i}"; done
          {
            cat transfer/v4-assets/chunk.first
            for i in $(seq -w 0 9); do cat "transfer/v4-assets/chunk.${i}"; done
          } > /tmp/v4-assets.tar.gz.b64
          base64 -d /tmp/v4-assets.tar.gz.b64 > /tmp/v4-assets.tar.gz
          echo "afe40867456e42b12cbbaa326d5159d1a9b219e1bd3bc23e9a36b8a5d07c1c43  /tmp/v4-assets.tar.gz" | sha256sum -c -
          rm -rf /tmp/v4-assets
          mkdir -p /tmp/v4-assets public/product-v4
          tar -xzf /tmp/v4-assets.tar.gz -C /tmp/v4-assets
          for name in kanban-left contact-history dashboard; do
            test -f "/tmp/v4-assets/${name}.webp"
            test "$(stat -c%s "/tmp/v4-assets/${name}.webp")" -gt 20000
            cp "/tmp/v4-assets/${name}.webp" "public/product-v4/${name}.webp"
          done
      - name: Commit clean binary assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf transfer/v4-assets
          rmdir transfer 2>/dev/null || true
          rm .github/workflows/install-v4-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add high resolution V4 product assets"
          git push
